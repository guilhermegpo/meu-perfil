name: CI

on:
  pull_request:
    branches: [main, develop]

# Pushes em main passam pelas mesmas verificações no workflow de deploy antes
# da publicação. Manter o CI apenas em pull requests evita duas execuções para
# o mesmo commit quando develop já está associado a um PR.

permissions:
  contents: read

jobs:
  verify:
    name: Verificar tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verificar acessibilidade, metadados e links
        run: npm run verify
